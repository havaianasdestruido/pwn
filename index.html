<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem 1:1 Preenchendo Laterais</title>
    <style>
        /* Remove margens e barras de rolagem */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000; /* Fundo preto caso a tela mude de proporção abruptamente */
        }

        .fullscreen-img {
            width: 700vw;          /* Força a imagem a ter 100% da largura da tela */
            height: 700vh;         /* Força a imagem a ter 100% da altura da tela */
            object-fit: cover;     /* Preenche o espaço sem distorcer (mantém o 1:1) */
            object-position: center; /* Centraliza o corte (corta igual em cima e embaixo) */
        }
    </style>
</head>
<body>

    <img class="fullscreen-img" src="pwn.jpg" alt="Minha imagem quadrada">

</body>
</html>
